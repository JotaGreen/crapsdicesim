<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biased Craps Simulator</title>
    <style>
        /* CSS: Layout and Visuals */
        body {
            /* Casino green felt background */
            background-color: #2e7d32; 
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .dice-container {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .die {
            /* Red dice background with white pips */
            background-color: #d32f2f;
            color: white;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px; /* Large unicode pips */
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            user-select: none;
            transition: transform 0.1s;
        }

        #roll-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            background-color: #ffc107; /* Golden button */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #c79100;
            transition: all 0.1s;
        }

        #roll-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c79100;
        }

        #roll-button:disabled {
            background-color: #9e9e9e;
            box-shadow: none;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 20px;
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Craps Simulator</h1>

    <div class="dice-container">
        <div id="die1" class="die">⚀</div>
        <div id="die2" class="die">⚀</div>
    </div>

    <button id="roll-button" onclick="handleRoll()">Roll Dice</button>

    <div class="stats">
        Current Bias for 8: <span id="bias-display">0%</span>
    </div>

    <script>
        /**
         * APP DOCUMENTATION
         * This app simulates two 6-sided dice. 
         * A random bias is generated on page load that makes the sum of 8 more likely 
         * than the standard 13.89% probability.
         */

        // Global variables
        let biasForEight = 0;
        const diceFaces = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
        const combinationsForEight = [
            [2, 6], [3, 5], [4, 4], [5, 3], [6, 2]
        ];

        // 1. Initialization: Define the bias for this session
        function init() {
            // Range: 0.1389 to 0.5 inclusive
            biasForEight = Math.random() * (0.5 - 0.1389) + 0.1389;
            
            document.getElementById('bias-display').innerText = (biasForEight * 100).toFixed(2) + "%";
            
            console.log("--- Session Initialized ---");
            console.log(`Target Probability for 8: ${biasForEight.toFixed(4)}`);
        }

        /**
         * Core Logic: Determines the result of the dice roll
         * @returns {Array} An array containing two integers [die1, die2]
         */
        function calculateResult() {
            console.log("Calculating roll result...");
            const rollChance = Math.random();
            
            // Logic Step 1: Check if we hit the biased '8'
            if (rollChance <= biasForEight) {
                console.log(`[BIAS HIT] Random value ${rollChance.toFixed(4)} <= ${biasForEight.toFixed(4)}`);
                
                // Logic Step 2: Randomly pick one of the 5 ways to get an 8
                const randomIndex = Math.floor(Math.random() * combinationsForEight.length);
                const result = combinationsForEight[randomIndex];
                
                console.log(`Selected combination for 8: ${result}`);
                return result;
            } 
            else {
                // Logic Step 3: Not an 8. Roll normally, but prevent 8 from occurring naturally.
                console.log(`[NORMAL ROLL] Random value ${rollChance.toFixed(4)} > ${biasForEight.toFixed(4)}`);
                
                let d1, d2;
                let attempts = 0;

                do {
                    d1 = Math.floor(Math.random() * 6) + 1;
                    d2 = Math.floor(Math.random() * 6) + 1;
                    attempts++;
                } while (d1 + d2 === 8);

                console.log(`Result: [${d1}, ${d2}] (Sum: ${d1+d2}) after ${attempts} attempts to avoid 8.`);
                return [d1, d2];
            }
        }

        /**
         * Animation and UI Handling
         */
        async function handleRoll() {
            const btn = document.getElementById('roll-button');
            const die1Element = document.getElementById('die1');
            const die2Element = document.getElementById('die2');

            // Disable button during roll
            btn.disabled = true;

            // Determine final result immediately, but keep it hidden
            const finalResult = calculateResult();

            // Setup Animation: 2 seconds of random faces
            const startTime = Date.now();
            const duration = 2000; // 2 seconds

            const animationInterval = setInterval(() => {
                // Show random faces during animation
                const tempD1 = Math.floor(Math.random() * 6) + 1;
                const tempD2 = Math.floor(Math.random() * 6) + 1;
                
                die1Element.innerText = diceFaces[tempD1];
                die2Element.innerText = diceFaces[tempD2];
                
                // Subtle shake effect
                die1Element.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
                die2Element.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;

                // End animation after 2 seconds
                if (Date.now() - startTime >= duration) {
                    clearInterval(animationInterval);
                    
                    // Set final result
                    die1Element.innerText = diceFaces[finalResult[0]];
                    die2Element.innerText = diceFaces[finalResult[1]];
                    
                    // Reset transform
                    die1Element.style.transform = "rotate(0deg)";
                    die2Element.style.transform = "rotate(0deg)";
                    
                    // Re-enable button
                    btn.disabled = false;
                    console.log("Animation complete. Result displayed.");
                    console.log("----------------------------");
                }
            }, 80); // Updates every 80ms
        }

        // Run initialization on load
        window.onload = init;
    </script>
</body>
</html>
