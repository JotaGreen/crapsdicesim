<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Simulator</title>
    <style>
        /* CSS: Minimalist Casino Interface */
        body {
            /* Classic casino green felt */
            background-color: #1a5e20; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        .dice-area {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
        }

        .die {
            /* The die face itself acts as the body. 
               The red background is sized to encompass the unicode pip character perfectly. */
            background-color: #d32f2f;
            color: white;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px; /* Sized so unicode char fills the block */
            line-height: 1;
            border-radius: 12px; /* Slight rounding for die corners */
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            user-select: none;
        }

        #roll-button {
            padding: 12px 50px;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #1a5e20;
            background-color: #ffca28;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #b28900;
            transition: all 0.05s;
        }

        #roll-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b28900;
        }

        #roll-button:disabled {
            background-color: #757575;
            box-shadow: none;
            color: #424242;
            cursor: not-allowed;
            transform: translateY(3px);
        }
    </style>
</head>
<body>

    <div class="dice-area">
        <div id="die1" class="die">⚀</div>
        <div id="die2" class="die">⚀</div>
    </div>

    <button id="roll-button" onclick="startRollSequence()">ROLL</button>

    <script>
        /**
         * APPLICATION LOGIC
         * A biased dice simulator where '8' has a custom probability.
         */

        let sessionBias8 = 0;
        const diceGlyphs = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
        const eightCombinations = [[2, 6], [3, 5], [4, 4], [5, 3], [6, 2]];

        // 1. Initialize the session bias on page load
        function initSession() {
            // Randomly defined between 0.1389 and 0.5 (inclusive)
            sessionBias8 = Math.random() * (0.5 - 0.1389) + 0.1389;
            
            console.log("--- New Session ---");
            console.log(`Bias for result '8' set to: ${(sessionBias8 * 100).toFixed(2)}%`);
        }

        /**
         * Step-by-step logic defined in requirements:
         * 1. Check if result will be 8 based on bias.
         * 2. If yes, pick one of the 5 ways to make 8.
         * 3. If no, roll until it's NOT an 8.
         */
        function getRollOutcome() {
            const rollSeed = Math.random();
            
            if (rollSeed <= sessionBias8) {
                console.log(`[LOGIC] Bias triggered (${rollSeed.toFixed(4)} <= ${sessionBias8.toFixed(4)}). Result: 8`);
                const combo = eightCombinations[Math.floor(Math.random() * eightCombinations.length)];
                return combo;
            } else {
                console.log(`[LOGIC] Standard roll triggered. Avoiding 8.`);
                let d1, d2;
                let rerolls = 0;
                
                // Roll until we get something that isn't an 8
                do {
                    d1 = Math.floor(Math.random() * 6) + 1;
                    d2 = Math.floor(Math.random() * 6) + 1;
                    if (d1 + d2 === 8) rerolls++;
                } while (d1 + d2 === 8);
                
                console.log(`[LOGIC] Final outcome [${d1}, ${d2}] (Sum: ${d1+d2}). Avoided 8 after ${rerolls} internal re-rolls.`);
                return [d1, d2];
            }
        }

        /**
         * Handles the UI animation and triggers logic
         */
        function startRollSequence() {
            const btn = document.getElementById('roll-button');
            const d1El = document.getElementById('die1');
            const d2El = document.getElementById('die2');
            
            const outcome = getRollOutcome();
            
            // UI state
            btn.disabled = true;
            const duration = 1500; // 1.5 seconds as requested
            const startTime = Date.now();

            console.log("--- Roll Started (1.5s Animation) ---");

            const animTimer = setInterval(() => {
                const now = Date.now();
                
                // Rapidly cycle random faces
                const temp1 = Math.floor(Math.random() * 6) + 1;
                const temp2 = Math.floor(Math.random() * 6) + 1;
                
                d1El.innerText = diceGlyphs[temp1];
                d2El.innerText = diceGlyphs[temp2];

                // Check for animation end
                if (now - startTime >= duration) {
                    clearInterval(animTimer);
                    
                    // Set result
                    d1El.innerText = diceGlyphs[outcome[0]];
                    d2El.innerText = diceGlyphs[outcome[1]];
                    
                    btn.disabled = false;
                    console.log("--- Roll Finalized ---");
                }
            }, 70); // Interval speed
        }

        // Initialize session parameters
        window.onload = initSession;
    </script>
</body>
</html>
