<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps Dice Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
        }

        #dice-box {
            width: 90vw;
            max-width: 800px;
            height: 60vw;
            min-height: 50vh;
            max-height: 500px;
            box-sizing: border-box;
            background-color: #0f6125; /* Casino felt green */
            border: 15px solid #3d2314; /* Wooden border */
            border-radius: 10px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        #roll-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #cc0000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        #roll-btn:active {
            transform: translateY(2px);
            background-color: #a30000;
        }

        #roll-btn:hover {
            background-color: #ff1a1a;
        }
    </style>
</head>
<body>

    <div id="dice-box"></div>
    <button id="roll-btn">Roll</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- Setup Scene, Camera, and Renderer ---
        const container = document.getElementById('dice-box');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        // Adjusted camera position to be more top-down (higher Y, closer Z)
        camera.position.set(0, 20, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Handle window resize for responsiveness
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 20, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- Setup Physics World (Cannon.js) ---
        const world = new CANNON.World();
        world.gravity.set(0, -30, 0); // Heavy gravity for snappy dice rolling
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 20;

        // Physics Materials
        const defaultMaterial = new CANNON.Material();
        const diceMaterial = new CANNON.Material();
        const contactMaterial = new CANNON.ContactMaterial(defaultMaterial, diceMaterial, {
            friction: 0.3,
            restitution: 0.5 // Bounciness
        });
        world.addContactMaterial(contactMaterial);

        // --- Create Invisible Physical Boundaries (Walls & Floor) ---
        function createWall(x, y, z, rotationX, rotationY) {
            const shape = new CANNON.Plane();
            const body = new CANNON.Body({ mass: 0, material: defaultMaterial });
            body.addShape(shape);
            body.position.set(x, y, z);
            body.quaternion.setFromEuler(rotationX, rotationY, 0);
            world.addBody(body);
        }

        // Floor
        createWall(0, -0.5, 0, -Math.PI / 2, 0);
        // 4 Walls to keep dice inside the box
        const boxWidth = 9;
        const boxDepth = 5;
        createWall(0, 0, -boxDepth, 0, 0);           // Back
        createWall(0, 0, boxDepth, 0, -Math.PI);     // Front
        createWall(-boxWidth, 0, 0, 0, Math.PI / 2); // Left
        createWall(boxWidth, 0, 0, 0, -Math.PI / 2); // Right

        // --- Generate Dice Textures Dynamically ---
        function createDiceTexture(number) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Red Background
            ctx.fillStyle = '#cc0000';
            ctx.fillRect(0, 0, 256, 256);
            
            // White Pips
            ctx.fillStyle = '#ffffff';
            const drawPip = (x, y) => {
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2);
                ctx.fill();
            };

            const center = 128;
            const offset = 65;

            if (number === 1) { drawPip(center, center); }
            else if (number === 2) { drawPip(center - offset, center - offset); drawPip(center + offset, center + offset); }
            else if (number === 3) { drawPip(center - offset, center - offset); drawPip(center, center); drawPip(center + offset, center + offset); }
            else if (number === 4) { drawPip(center - offset, center - offset); drawPip(center + offset, center + offset); drawPip(center - offset, center + offset); drawPip(center + offset, center - offset); }
            else if (number === 5) { drawPip(center - offset, center - offset); drawPip(center + offset, center + offset); drawPip(center - offset, center + offset); drawPip(center + offset, center - offset); drawPip(center, center); }
            else if (number === 6) { drawPip(center - offset, center - offset); drawPip(center + offset, center + offset); drawPip(center - offset, center + offset); drawPip(center + offset, center - offset); drawPip(center - offset, center); drawPip(center + offset, center); }

            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.2 });
        }

        const materials = [
            createDiceTexture(1), createDiceTexture(6), 
            createDiceTexture(2), createDiceTexture(5), 
            createDiceTexture(3), createDiceTexture(4)
        ];

        // --- Create Dice ---
        const diceSize = 1.2;
        const geometry = new THREE.BoxGeometry(diceSize, diceSize, diceSize);
        const diceMeshes = [];
        const diceBodies = [];

        function createDie() {
            // Three.js Mesh
            const mesh = new THREE.Mesh(geometry, materials);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            diceMeshes.push(mesh);

            // Cannon.js Body
            const shape = new CANNON.Box(new CANNON.Vec3(diceSize/2, diceSize/2, diceSize/2));
            const body = new CANNON.Body({ mass: 1, material: diceMaterial });
            body.addShape(shape);
            world.addBody(body);
            diceBodies.push(body);
        }

        createDie(); // Die 1
        createDie(); // Die 2

        // --- Rolling Logic ---
        function rollDice() {
            diceBodies.forEach((body, index) => {
                // Reset position slightly apart and high up
                body.position.set((index * 2) - 1, 5 + (Math.random() * 2), 2);
                
                // Randomize starting rotation
                body.quaternion.setFromEuler(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                
                // Apply chaotic force and spin
                body.velocity.set((Math.random() - 0.5) * 10, -5, -15 - (Math.random() * 10)); // Throw towards the "back wall"
                body.angularVelocity.set((Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20, (Math.random() - 0.5) * 20);
            });
        }

        document.getElementById('roll-btn').addEventListener('click', rollDice);

        // Initial roll on load
        rollDice();

        // --- Animation Loop ---
        const timeStep = 1 / 60;
        function animate() {
            requestAnimationFrame(animate);

            // Step the physics world
            world.step(timeStep);

            // Sync visual meshes with physics bodies
            for (let i = 0; i < diceMeshes.length; i++) {
                diceMeshes[i].position.copy(diceBodies[i].position);
                diceMeshes[i].quaternion.copy(diceBodies[i].quaternion);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
